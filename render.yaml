# Render Blueprint: API service, background worker, PostgreSQL, Redis
# Worker is now a separate Render service for independent scaling.
# Set UPLOAD_TOKEN, CORS_ORIGINS, and R2_* in the Render dashboard after deploy.

databases:
  - name: gait-db
    databaseName: gait_analyzer
    user: gait
    plan: basic-256mb

services:
  - type: redis
    name: gait-redis
    plan: free
    ipAllowList: []   # internal access only

  - type: web
    name: gait-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gait-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gait-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Shared secret for upload/delete endpoints. Set to a random string and
      # also set NEXT_PUBLIC_UPLOAD_TOKEN to the same value in Vercel.
      - key: UPLOAD_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Clerk JWKS endpoint for JWT verification. Find in Clerk dashboard → API Keys.
      # Format: https://<your-clerk-domain>/.well-known/jwks.json
      - key: CLERK_JWKS_URL
        sync: false
      # Optional: set to reduce worker memory (e.g. GAIT_MAX_FRAMES=600, GAIT_MAX_WIDTH=960)
      - key: GAIT_MAX_FRAMES
        sync: false
      - key: GAIT_MAX_WIDTH
        sync: false
      # Stripe billing. From Stripe Dashboard → Developers → API keys / Webhooks / Products.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID_MONTHLY
        sync: false
      - key: STRIPE_PRICE_ID_YEARLY
        sync: false
      # Public frontend URL, used to build Stripe checkout/portal redirect URLs
      # and referral links.
      - key: FRONTEND_URL
        sync: false
      # Dev-only escape hatch — force every user to appear as Pro. Leave unset in production.
      - key: DEV_FORCE_PRO_TIER
        sync: false

  - type: worker
    name: gait-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: standard
    dockerCommand: "celery -A backend.worker worker --loglevel=info --concurrency=1 --max-tasks-per-child=1"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gait-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: gait-redis
          type: redis
          property: connectionString
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Optional: set to reduce worker memory (e.g. GAIT_MAX_FRAMES=600, GAIT_MAX_WIDTH=960)
      - key: GAIT_MAX_FRAMES
        sync: false
      - key: GAIT_MAX_WIDTH
        sync: false
      # Subsample video to this many frames per second before pose extraction (e.g. 10).
      # Reduces memory and CPU significantly; 8-10 fps is sufficient for gait analysis.
      - key: GAIT_TARGET_FPS
        sync: false
